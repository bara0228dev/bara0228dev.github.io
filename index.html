<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bara dev</title>
<style>
  :root { --bg:#f5eade; --ink:#2c3e50; --sub:#7a8a99; --accent:#e8434f; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap { max-width:560px; width:100%; text-align:center; }
  h1 { font-size:34px; letter-spacing:1px; margin-bottom:8px; }
  .tag { color:var(--sub); font-size:15px; margin-bottom:40px; }
  .card {
    background:#fff; border-radius:18px; padding:28px 24px; text-align:left;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
  }
  .card h2 { font-size:21px; margin-bottom:6px; }
  .card p { color:var(--sub); font-size:14px; line-height:1.6; }
  footer { margin-top:36px; color:var(--sub); font-size:13px; line-height:1.9; }
  a { color:var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>bara dev</h1>
    <div class="tag">Indie mobile game development</div>
    <div class="card">
      <h2>Slide It</h2>
      <p>A classic sliding puzzle with hand-picked artwork. Clear 3&times;3 to unlock 4&times;4, then 5&times;5, and collect bronze, silver and gold frames.</p>
    </div>
    <footer>
      Contact: <a href="mailto:mintphilia@gmail.com">mintphilia@gmail.com</a>
    </footer>
  </div>
</body>
</html>
